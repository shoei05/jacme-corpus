version: v1.1
date: '2026-10-10'
status: full-run version (2026-10-10). T11/T13 low reliability; scope/multi/secondary exploratory
based_on: codebook_v1 + consult/20261010_chatgpt_tag_audit_pilot02_raw.md（pilot02 held-out 60件の所見）
unit: comment（主張単位への分割は未実施。複合文は multi_function と secondary_function で識別する）
note: '定義のみ。原文の引用例は canonical/private/codebook_v0_examples.md（v0と共通）と監査CSVの備考にある。

  T01〜T10 の定義は v0 から広げない（経年比較のため）。網羅的な内容分類は T11〜T13 と T00 で受ける。

  公式判定、コメント種別、語調は上書きせず併存させる。下位領域名・科目名・組織名だけでタグを付けない。

  '
thresholds:
  theme_tag_default: 0.3
  theme_not: 0.2
  per_theme:
    T13_resources_facilities_partnership: 0.6
  provenance: 'T01〜T10 の 0.3 は pilot01（v0）で選び pilot02（v1）・pilot03（v1.1）の held-out で確認（pilot03: P0.81 R0.90 F1 0.85）。T11・T12 の 0.3 と T13 の 0.6 は pilot03 の v1.1 確率で F1 が最大の値（T11 F1 0.63、T12 0.86、T13 0.75
    だが陽性3件）。T11 と T13 は信頼性が低い。全確率を保存しているので閾値は再実行なしに変更できる。'
  reliability:
    low:
    - T11_curriculum_content_structure
    - T13_resources_facilities_partnership
    exploratory:
    - observed_scope
    - requested_scope
    - multi_function
    - secondary_function
axes:
  theme:
    type: multi-label noul（T00 はコードで導出）
    rules:
    - T00 該当なし は「本文の内容は判定できるが、どのテーマの包含条件も満たさない」。未判定・判定不能ではない。他テーマと併記しない。DBでは 判定済み該当なし と 未判定 を別状態にする。
    - T03/T04 は評価対象と利用目的で分ける。学生の能力・成績の測定・判定・返却と、学生評価方法の信頼性・妥当性・公平性の検証は T03（検証であっても T04 にしない）。学生・卒業生の実績や学生・教員の意見を教育プログラムの点検・改善に用いるのは T04。両方が明示される場合だけ併記。成績不振者への面談・支援は評価方法の記述がなければ T06。
    - T05 は参画者と参画形態で判定する。学生等の代表の委員会参加、関係者（患者・住民・地域医療者・卒業生）への意見聴取は T05。通常の教員による内部運営は T05 ではない。本文に参画者がなければ付けない（見出しから補わない）。
    - 'T07 の範囲: 教員の募集・選抜、FD の実施・参加、教育業績評価、教育専門教員の確保。教員への「周知」だけ、FD が手段として一語出るだけでは付けない。'
    - テーマ・機能と実装段階を機械的に対応させない。
    - T11 の除外はコメント全体ではなく主張単位に働く。T01/T02/T09 の主張と別に、構造・配列・教育方法についての独立した主張があれば T11 を併記できる。
    - T13 の「連携」は組織・協定・協力体制が本文に明示された場合に限る。成果の連続性や「一貫した教育」の表現だけでは付けない。
    labels:
      T00_none:
        name: 該当なし
        definition: 内容は判定できるが T01〜T13 のいずれの包含条件も満たさない。コードで導出（閾値以上のテーマが無く、かつ不確実帯のテーマも無い場合）。
      T01_outcome_based:
        name: 学修成果基盤型教育
        definition: 卒業時・卒後の学修成果（コンピテンシー、ディプロマ・ポリシー、マイルストーン）の明文化と、科目・方法・評価との整合、到達の確認。
        include: 学修成果の策定・周知・見直し、成果とカリキュラム／評価の対応づけ。
        exclude: 学修成果に触れない科目内容・教育方法（T11）。一般的な教育目標の整理だけでは付けない。評価方法そのものは T03。
      T02_clinical_clerkship:
        name: 診療参加型実習・臨床能力
        definition: 診療参加型臨床実習の期間・症例・場の確保、学生の実際の診療参加、臨床技能・態度の修得。
        include: 実習期間、診療科・施設の確保、担当患者・手技経験、実習前後の臨床能力。
        exclude: 実習の評価方法だけ（T03）。地域性が主題なら T08 を併記。
      T03_assessment_feedback:
        name: 学生評価とフィードバック
        definition: 学生の学修評価の方法・運用、信頼性・妥当性・公平性の検証、評価結果の学生への返却。
        include: 評価方法の導入・多様化、技能・態度評価、形成的評価、学内試験の信頼性・妥当性の検証、疑義申立。
        exclude: 教育プログラムの点検・改善（T04）。成績不振者支援のみ（T06）。
      T04_ir_quality_improvement:
        name: IR・内部質保証・継続的改善
        definition: 教育プログラムを点検・評価・改善する組織と仕組み、データ収集・分析、意思決定・改善への利用。
        include: IR、プログラム評価委員会、PDCA、学生・卒業生の実績や関係者の意見のプログラム改善への利用。
        exclude: 学生個人の評価方法の検証（T03）。管理運営一般の質保証（T12）。
      T05_participation:
        name: 学生・患者・地域の参画
        definition: 学生、患者・住民、地域医療者、卒業生などの関係者が、策定・評価・意思決定に参加すること。
        include: 学生代表の委員会参加、関係者への意見聴取、意見の意思決定への反映。
        exclude: 教員だけの内部運営。参画者が本文にないもの。データ分析のみ（T04）。
      T06_fair_admission_support:
        name: 公平な選抜・学修環境・支援
        definition: 入学者選抜の方針・公平性・透明性、学生の受け入れ、学修環境、学生支援。
        include: 選抜方法と公平性、学生相談・メンタルヘルス、ハラスメント対策、合理的配慮、成績不振者支援、経済支援。
        exclude: 教員の選抜（T07）。学生評価の公平性（T03）。 物的な学修スペース・設備そのものは T13（支援・相談・安全・配慮が主題なら T06、施設の整備が主題なら T13。両方の主張があれば併記）。
      T07_faculty_development:
        name: 教員の教育能力・教育貢献
        definition: 教員の募集・選抜方針、教育能力の開発（FD）、教育業績の評価と昇進・資源配分への反映、教育専門教員の確保。
        include: FD の実施・参加率、学外指導者への研修、教育業績評価、教員の確保。
        exclude: 教員への周知だけ。FD が手段として一語出るだけ。学生への教育内容（T11）。
      T08_social_accountability:
        name: 社会的責任・地域志向
        definition: 使命・教育・実習・卒後進路における地域・社会のニーズへの対応と保健医療部門との連携。
        include: 地域医療教育・地域実習、地域ニーズの反映、卒業生の地域定着、行政・保健医療部門との協働、社会的責任の評価。
        exclude: 地域性に触れない実習（T02）。一般的な使命の明示（T12）。
      T09_scientific_method:
        name: 科学的方法・EBM・研究
        definition: 科学的思考、EBM、研究方法の教育と学生の研究参加。
        include: EBM の系統的教育、研究室配属・研究活動、研究マインド。
        exclude: 教員の研究業績のみ（T07）。研究資源・施設（T13）。
      T10a_digital_ai:
        name: デジタル・AI
        definition: 教育手段としての ICT・e-ラーニング・オンライン、教育内容としての AI・情報学。
        include: LMS、電子ポートフォリオ、オンライン教育、AI・データサイエンス教育、ICT 環境。
        exclude: 情報の語だけで教育との関係がないもの。
      T10b_international:
        name: 国際交流
        definition: 学生・教員の国際交流、海外実習・留学、国際的学修。
        include: 海外実習、留学生受け入れ、国際連携、英語での教育が国際交流目的で述べられるもの。
        exclude: 「国際基準」「国際的視野」の語だけ。
      T11_curriculum_content_structure:
        name: 教育内容・カリキュラム構造・教育方法
        definition: カリキュラムの構造・配列・教育期間・教育方法（統合、能動的学修、多職種連携教育、一般教養との連携、倫理・キャリア教育の科目設計）について独立した主張があるもの。
        include: 水平的・垂直的統合、科目の配列・配置、教養教育との連携、PBL・TBL・反転授業などの教育方法の採用、多職種連携教育、選択科目の設計。
        exclude: T01（学修成果との整合）、T02（臨床実習）、T09（EBM）の内容の周りに「カリキュラム」「教育」の語が出るだけのもの。評価の場面で教育方法名が出るだけのもの（T03）。構造・方法についての独立した主張がなければ付けない。
      T12_mission_governance:
        name: 使命・自律性・統轄・管理運営
        definition: 一般的な使命の明示、大学の自律性・教育研究の自由、執行体制、意思決定、予算、事務、管理運営の質保証。
        include: 使命の策定・周知、学部の自律性、執行部・委員会の体制、教育予算、事務組織、機関別認証評価。
        exclude: 卒業時学修成果（T01）。プログラム評価・改善（T04）。参画者が主題（T05）。
      T13_resources_facilities_partnership:
        name: 教育資源・施設・教育連携
        definition: 物的な教育資源（施設・設備・図書・学修スペース・感染対策設備など）、または明示された組織的な連携・協力体制（卒前卒後の教育組織、協定・連携組織）。
        include: 講義室・実習室・自習室・図書館・シミュレーション設備、キャンパス計画、設備の整備・更新、卒後研修組織との明示的な協力体制。
        exclude: 種類を特定しない「資源」「資源配分」の語だけ。学修成果の連続性や「連携のある教育システム」という表現だけで組織的連携を認定しない。教員確保（T07）、臨床実習施設の確保（T02）、ICT（T10a）。学修環境のうち支援・安全・配慮が主題のものは T06。
  function:
    type: single choice + multi_function（noul）+ secondary_function（choice, 無しを含む）
    rules:
    - 主機能は、コメントが主として変更を求める対象、または特色として評価する対象から選ぶ。
    - 手段・媒体・実施場所として登場する機能は主機能にしない。「委員会」「施設」「組織」の語だけで F7・F8 にしない。
    - プログラム評価組織の独立性は F4、教員の能力開発は F6、学生の委員会参加は F5。
    - 複合文（2つ以上の対象に別々の要求・評価がある）は multi_function=true とし、副機能を残す。主張単位への分割は次段階。
    - F5 の「参画」は学生に限る。患者・住民・地域医療者・卒業生の参画は統治・意思決定への関与として F7（主題がプログラム評価なら F4）。
    - 周知・説明だけを求めるコメントは、周知の対象が教員なら F6、学生なら F5、全体なら F7。
    - 複合文の段階は主要求（主機能に対応する主張）の段階を取る。副要求の段階は記録しない（主張単位への分割後に扱う）。
    - 「別対象への要求」と「手段」を区別する。資源配分や連携が支援の手段として出るだけなら副機能にしない。
    labels:
      F1_curriculum_design:
        name: カリキュラム設計
        definition: 学修成果、科目構成、統合、教育期間、教育方法の設計
      F2_teaching_delivery:
        name: 教育実施
        definition: 授業・実習の実施状況、学修機会の提供、指導の実際
      F3_student_assessment:
        name: 学生評価
        definition: 学生の学修評価の方法・運用・フィードバック
      F4_program_evaluation_ir:
        name: プログラム評価・IR
        definition: 教育プログラムのモニタリング・評価・改善の仕組みとデータ、評価組織
      F5_admission_support_participation:
        name: 学生選抜・支援・参画
        definition: 入学者選抜、受け入れ、学生支援・相談、学生の参画
      F6_faculty_fd:
        name: 教員・FD
        definition: 教員の募集・選抜・能力開発・業績評価
      F7_governance_budget:
        name: 統治・予算
        definition: 統轄組織、執行部、意思決定、教育予算と資源配分、事務
      F8_resources_partnership:
        name: 資源・外部連携
        definition: 施設・設備、臨床実習施設、ICT基盤、研究資源、学外・保健医療部門との連携
      F9_other:
        name: その他
        definition: 上のいずれにも当たらない
  stage:
    type: observed_stage / requested_stage（choice）＋ scope（choice）＋ outcome_confirmed（noul、observed のみ）
    rules:
    - observed は全種別に付ける。本文に現状の明示がある場合に限り、改善要求から現状を推測しない。要求文中の組織名・センター名だけで設置・活動状況を認定しない。
    - requested は 改善のための助言・改善のための示唆・追加審査におけるコメント にだけ付け、特色ある点は 該当なし。
    - 「設定・配置・策定」のみなら D1。実施・履修・授業提供が明示されれば D2。学生を採点・評価する行為自体は D2、評価方法や教育プログラムの点検・検証は D3、結果を改善・意思決定へ用いる要求・実績は D4。
    - D1 に分類したことは未実施の判定を意味しない。observed の 記載なし の多さを実装不足と解釈しない。
    - 展開範囲（scope）と成果確認（outcome_confirmed）は段階と別の軸。「系統的」「定期的」は全対象展開を意味しない。
    - observed と requested は同じ対象とは限らない。段階の差や平均を成熟度にしない。
    - '「充実」「確保」「検討」の要求: 何を実施・提供するかが特定されていれば D2（例: 教育が行われるようにする）、計画・体制を作る要求なら D1（例: 教育計画を構築する）、対象も行為も特定されない「さらに充実」「検討」は N1 段階決定不能。'
    - 'D3 と D4 の境界: 分析結果を提供・報告するまでは D3。結果を用いて見直し・追加・意思決定を行う（または行うよう求める）ときだけ D4。「立案のために提供する」は D3。'
    - 'observed の「導入」「取り入れる」「機会を設ける」: 実際に運用されている（学生が受けている）ことが明示されれば D2。「体制がある」「環境がある」「導入を決めた」は D1。引用された将来方針は、決定済みで実施時期が示されていれば D1、そうでなければ N0。'
    - 'scope の母集団: 記述の対象集団（学年・科目・選抜区分）が本文で限定されていれば一部明示、対象全体（全学年・全教員など）が明示されれば全対象明示。母集団の中で全員（例: 6年生全員）は、母集団が限定されているので一部明示。requested が 該当なし/記載なし のときの scope は 該当なし。'
    - 複合文は主要求の段階を記録する。
    labels:
      D1_design_setup:
        name: 設計・整備
        definition: 方針・計画・規程・目標が定められた、または委員会・部門・人員・設備が置かれた
      D2_operation:
        name: 運用
        definition: 教育・評価・仕組みが実施・提供されている
      D3_review_evaluation:
        name: 点検・評価
        definition: 実施状況や効果を点検・検証・評価している
      D4_use_of_results:
        name: 結果利用
        definition: 点検・評価の結果を改善や意思決定に用いている
      N0_not_stated:
        name: 記載なし
        definition: 段階に関する記載が本文にない
      N1_undeterminable:
        name: 段階決定不能
        definition: 記載はあるが D1〜D4 のどれかを決められない
      S0_not_applicable:
        name: 該当なし
        definition: requested で、要求を含まない種別（特色ある点）のとき。コード側で付ける
    scope_labels:
      P1_partial_explicit:
        name: 一部明示
        definition: 一部の学年・科目・教員・部署に限ると明示
      P2_all_explicit:
        name: 全対象明示
        definition: 全学年・全科目・全教員など対象全体に及ぶと明示
      P9_unknown:
        name: 不明
        definition: 展開範囲の記載がない
      S0_not_applicable:
        name: 該当なし
        definition: requested が 該当なし または 記載なし のとき。コード側で付ける
    outcome_confirmed:
      name: 成果確認
      definition: 学修成果・卒後成果などの到達が測定され確認されたと本文が明示する（目標を定めただけでは該当しない）
examples_contrastive:
  note: 原文の引用はしない。形を示す短い言い換え。
  requested_stage:
  - text: ○○教育が行われるようにすべきである
    code: D2
  - text: ○○の教育計画を構築すべきである
    code: D1
  - text: ○○をさらに充実することが望まれる
    code: N1
  - text: 分析結果を各委員会へ提供すべきである
    code: D3
  - text: 分析結果に基づいて科目を見直し追加すべきである
    code: D4
  observed_stage:
  - text: ○○を導入し、全学年で実施している
    code: D2 / 全対象明示
  - text: ○○に参画できる体制が整えられている
    code: D1
  - text: ○○を経験できる環境がある
    code: D1
  - text: 第6学年全員が○○を受講している
    code: D2 / 一部明示（母集団が学年に限定）
  theme_T11_T13:
  - text: 学修成果とカリキュラムの対応表を作成している
    code: T01 のみ（T11 なし）
  - text: 基礎と臨床の垂直統合科目を配置している
    code: T11
  - text: 教育資源を適切に配分すべきである
    code: T13 なし（資源の種類不特定）、機能 F7
  - text: 自習室を整備し学生が利用している
    code: T13（施設）。学生支援が主題なら T06 を併記
  - text: 卒前と卒後の教育を連携組織のもとで一貫させている
    code: T13（組織的連携の明示）
  - text: 卒前と卒後の学修成果を関連づけるべきである
    code: T01（T13 なし）
  function:
  - text: 患者代表がプログラム評価委員会に参加している
    code: テーマ T05、主機能 F4
  - text: 住民代表が運営会議に参加している
    code: テーマ T05、主機能 F7
  - text: 学修成果を教員に周知すべきである
    code: F6
  - text: IR部門を設置し、学生代表を加えるべきである
    code: 主機能 F4、複合あり、副機能 F5
  - text: 地域実習を支援するため関連病院との連携を活用している
    code: 主機能 F2、連携は手段なので副機能にしない
