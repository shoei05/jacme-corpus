  - '#d9742a'
  - '#b53a35'
  - '#7b62b8'
  - '#4a9a44'
  group_dark:
  - '#4f8fe0'
  - '#c9742e'
  - '#c43d6e'
  - '#9a86d6'
  - '#5aa85a'
  judgment_light:
  - '#2f8f5b'
  - '#d9931f'
  - '#b8322f'
  - 'neutral #9a9a9a'
  judgment_dark:
